<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oacorns Foods – Under Maintenance</title>
<style>
:root{
  --bg:#1f6b3a;
  --bg-deep:#15512b;
  --ink:#f6f3e8;
  --soft:#cfe5d3;
  --accent:#f1c24b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#17492a;--bg-deep:#0f3720;--ink:#f3f0e4;--soft:#b9d6bf;--accent:#f1c24b}
}
:root[data-theme="dark"]{--bg:#17492a;--bg-deep:#0f3720;--ink:#f3f0e4;--soft:#b9d6bf;--accent:#f1c24b}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 50% 0%,var(--bg) 0%,var(--bg-deep) 100%);
  color:var(--ink);
  font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
main{max-width:560px;width:100%;text-align:center}
.mark{width:72px;height:72px;margin:0 auto 28px;display:block}
.brand{font-size:1.05rem;letter-spacing:.04em;color:var(--soft);margin:0 0 14px}
h1{font-size:clamp(2.1rem,7vw,3.4rem);line-height:1.1;margin:0 0 18px;font-weight:700}
p.msg{font-size:1.15rem;line-height:1.65;color:var(--soft);margin:0 auto;max-width:46ch}
.bar{width:140px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);margin:34px auto 0;overflow:hidden}
.bar span{display:block;height:100%;width:40%;background:var(--accent);border-radius:3px;animation:slide 2.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
@media (prefers-reduced-motion:reduce){.bar span{animation:none;width:60%}}
footer{margin-top:40px;font-size:.9rem;color:var(--soft);opacity:.85}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 72 72" aria-hidden="true">
    <path d="M36 6c-2 0-3 2-3 4v4h6v-4c0-2-1-4-3-4z" fill="#f1c24b"/>
    <path d="M14 30c0-9 10-15 22-15s22 6 22 15z" fill="#f1c24b"/>
    <path d="M16 32h40c0 18-9 32-20 32S16 50 16 32z" fill="#f6f3e8"/>
    <path d="M24 38c0 10 5 18 12 20" stroke="#1f6b3a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".35"/>
  </svg>
  <p class="brand">oacornsfoods.com</p>
  <h1>We’re under maintenance</h1>
  <p class="msg">We’re making a few improvements to the Oacorns Foods website. We’ll be back shortly. Thank you for your patience.</p>
  <div class="bar" role="presentation"><span></span></div>
  <footer>© Oacorns Foods</footer>
</main>
</body>
</html>
